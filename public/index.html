<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>BlastMaze</title>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>
    <script src="/game.js"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            width: 100%;
            height: 100%;
            background-color: #1a1a1a;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>
    <script>
        console.log("Page loaded, scripts running.");

        const socket = io();

        socket.on('connect', () => {
            console.log('🟢 Socket.IO: connected! ID:', socket.id);
        });

        socket.on('disconnect', () => {
            console.log('🔴 Socket.IO: disconnected!');
        });
    </script>
</body>
</html>
